services:
  # Option 1: Render Static Site (Recommended for fastest CDN delivery)
  - type: web
    name: ahujas-dental-clinic-static
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

  # Option 2: Render Web Service (Node.js Express production server)
  - type: web
    name: ahujas-dental-clinic-node
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
